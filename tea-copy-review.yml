    - data:
        code: "import json,re\ndef main(raw, title):\n    t=title.strip();result={'allow':'否','result':'转人工复核','reason':'标题审核结果格式异常，请人工检查。','title':'','draft':t[:2000],'length':len(t)}\n\
          \    if not t:result['reason']='未生成标题或模型调用失败，请重试或交人工处理。';return result\n\
          \    if len(t)>20 or '\\n' in t or '\\r' in t:result['reason']='标题超过20字符或不是单行，请人工修改后重新审核。';return\
          \ result\n    bad=['国家级','销量第一','全网第一','世界第一','最高级','百分百','100%','降血糖','降血压','治疗','治愈','减肥','排毒','原价','划线价','保证助眠','零农残']\n\
          \    found=[w for w in bad if w in t]\n    if found:result['reason']='课堂固定风险规则命中：'+'、'.join(found)+'。请人工核实与修改。';return\
          \ result\n    try:\n        s=raw.strip()\n        if s.startswith('```'):s=re.sub(r'^```(?:json)?\\\
          s*','',s);s=re.sub(r'\\s*```$','',s)\n        d=json.loads(s)\n        if\
          \ not isinstance(d,dict) or d.get('action') not in ['通过','转人工'] or not isinstance(d.get('reason'),str)\
          \ or not d['reason'].strip():return result\n        result['reason']=d['reason'][:500]\n\
          \        if d['action']=='通过':result.update(allow='是',result='审核通过',title=t,draft='')\n\
          \        return result\n    except Exception:return result\n"
