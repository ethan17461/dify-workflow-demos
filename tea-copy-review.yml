    - data:
        code: "import json,re\ndef parse(raw):\n    s=raw.strip()\n    if s.startswith('```'):\n\
          \        s=re.sub(r'^```(?:json)?\\s*','',s);s=re.sub(r'\\s*```$','',s)\n\
          \    d=json.loads(s)\n    if not isinstance(d,dict): raise ValueError('not\
          \ object')\n    return d\ndef main(raw, product_name, selling_point, stage):\n\
          \    result={'allow':'否','result':'转人工复核','reason':'资料检查结果格式异常，请人工检查后重试。','points':'','title':'','draft':''}\n\
          \    if not product_name.strip() or not selling_point.strip() or stage not\
          \ in ['认知','兴趣','购买','忠诚']:\n        result.update(result='请补充资料',reason='请填写茶款名称、具体商品资料，并选择有效营销阶段。');return\
          \ result\n    try:\n        d=parse(raw);a=d.get('action');r=d.get('reason');p=d.get('points')\n\
          \        if a not in ['继续生成','补充资料','转人工'] or not isinstance(r,str) or not\
          \ r.strip() or not isinstance(p,list) or len(p)>3: return result\n     \
          \   if any(not isinstance(x,str) or not x.strip() or x not in selling_point\
          \ for x in p): return result\n        result['reason']=r[:500]\n       \
          \ if a=='补充资料':result['result']='请补充资料'\n        elif a=='继续生成':\n     \
          \       if not p:return dict(result,reason='未提取到可用的原文卖点，请人工检查商品资料。')\n \
          \           result.update(allow='是',result='资料检查通过',points='；'.join(p))\n\
          \        return result\n    except Exception:return result\n"
        code_language: python3
        desc: 格式异常关闭放行；不凭模型输出直接放行
        outputs:
          allow:
            children: null
            type: string
          draft:
            children: null
            type: string
          points:
            children: null
            type: string
          reason:
            children: null
            type: string
          result:
            children: null
            type: string
          title:
            children: null
            type: string
        title: 校验资料检查结果
        type: code
        variables:
        - value_selector:
          - '402'
          - text
          variable: raw
        - value_selector:
          - '401'
          - product_name
          variable: product_name
        - value_selector:
          - '401'
          - selling_point
          variable: selling_point
        - value_selector:
          - '401'
          - stage
          variable: stage
