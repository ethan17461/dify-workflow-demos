    - data:
        desc: 仅保留三个固定标签；格式异常转人工复核
        template: '{% set v = raw | trim %}{{ v if v in [''建议进面试'', ''本次不进入面试'', ''需要人工复核'']
          else ''需要人工复核'' }}'
        title: 统一为三种结果
