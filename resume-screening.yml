            结果固定为“需要人工复核”。写“结果：需要人工复核”“原因：…”“待核实：…”“处理：人工确认前不自动进入面试”。最多220字。

            岗位要求不清楚：请招聘方明确职责、必要条件及优先项，不要求所有岗位都提供学历、年限或毕业时间。

            材料矛盾：直接引用两处冲突事实，请核实哪项准确，不替人选信某项，不擅自认定不合格。

            规则不当：指出相关个人属性条件不用于自动筛选，交人工检查。

            若原始分类不属于三个合法结果，明确写判断格式异常需检查，不能伪装成招聘结论。'
